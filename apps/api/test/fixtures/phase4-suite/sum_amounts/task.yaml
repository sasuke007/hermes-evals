summary: Sum the amounts
limits:
  max_turns: 5
  run_budget_seconds: 60
  toolsets_needed: [file]
answer:
  format: fenced_json
verification:
  - key: answer
    type: numeric_tolerance
    params: { path: value, abs: 0.01 }
  - key: cites
    type: text_match
    params: { path: note, contains: ['source: amounts.csv'] }
  - key: quality
    type: llm_judge
    primary: true
    params: { rubric: rubric.md, model: mock/judge }
