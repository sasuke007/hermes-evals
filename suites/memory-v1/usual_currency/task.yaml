summary: Total owed on unpaid invoices in the user's usual reporting currency, which USER.md holds
limits:
  max_turns: 20
  run_budget_seconds: 300
  toolsets_needed: [file, terminal]
answer:
  format: fenced_json
  path: total
verification:
  - key: answer
    type: numeric_tolerance
    primary: true
    params: { path: total, rel: 0.001 }
  - key: currency
    type: exact_match
    params: { path: currency }
