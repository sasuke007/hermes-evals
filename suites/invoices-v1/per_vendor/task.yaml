summary: Amount owed to each vendor, whose names are not always spelt alike
limits:
  max_turns: 20
  run_budget_seconds: 300
  toolsets_needed: [file, terminal]
answer:
  format: fenced_json
  path: outstanding_by_vendor
verification:
  - key: answer
    type: json_match
    primary: true
    params: { path: outstanding_by_vendor }
  - key: reads_ledger
    type: trajectory_match
    params: { tool: read_file, min_calls: 1 }
