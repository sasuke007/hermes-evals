name: invoices-v1
version_label: '1.0'
description: >-
  Twelve accounts-payable questions over one family of invoice fixtures,
  generated with a fixed seed by scripts/fixtures/invoices-v1.ts, which also
  computes every reference. Each task has one trap that the invoice-method
  skill warns about. The recommended experiment compares a baseline with the
  same configuration plus the skill, preloaded.
tasks:
  - total_due
  - overdue_list
  - dup_invoices
  - vat_split
  - credit_notes
  - currency_mix
  - missing_po
  - late_fees
  - per_vendor
  - disputed
  - partial_pay
  - summary_file
