summary: Write summary.csv with one row per vendor and what is still owed to it
limits:
  max_turns: 20
  run_budget_seconds: 300
  toolsets_needed: [file, terminal]
answer:
  format: fenced_json
verification:
  - key: summary_csv
    type: file_check
    primary: true
    params:
      path: summary.csv
      format: csv
      columns: [vendor, unpaid_invoices, outstanding]
      row_count: 8
  - key: totals
    type: verifier_script
    params: { script: check_summary.py, timeout_s: 30 }
self_check:
  expected_workspace: expected
  negative_control: true
