summary: Net and VAT per VAT band, one of which is zero-rated
limits:
  max_turns: 20
  run_budget_seconds: 300
  toolsets_needed: [file, terminal]
answer:
  format: fenced_json
  path: vat_bands
verification:
  - key: answer
    type: json_match
    primary: true
    params: { path: vat_bands }
  - key: total_vat
    type: numeric_tolerance
    params: { path: total_vat, abs: 0.01 }
