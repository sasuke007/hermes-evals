summary: Closing balance of a BX-7 statement whose account opens overdrawn
limits:
  max_turns: 20
  run_budget_seconds: 300
  toolsets_needed: [file, terminal]
answer:
  format: fenced_json
  path: closing_balance
verification:
  - key: answer
    type: numeric_tolerance
    primary: true
    params: { path: closing_balance, abs: 0.01 }
