summary: September travel spend from a plain CSV of expense claims (the control)
limits:
  max_turns: 20
  run_budget_seconds: 300
  toolsets_needed: [file, terminal]
answer:
  format: fenced_json
  path: travel_september
verification:
  - key: answer
    type: numeric_tolerance
    primary: true
    params: { path: travel_september, abs: 0.01 }
