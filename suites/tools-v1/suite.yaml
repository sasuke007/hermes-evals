name: tools-v1
version_label: '1.0'
description: >-
  Six tasks whose difficulty depends on the tools the agent has: a 20,000-row
  CSV, IBANs to extract and validate from a log, a nested JSON export to
  reshape into a file, the SHA-256 of a file, a join over three CSV files, and
  a one-line lookup as a control. Fixtures, prompts and every reference are
  generated with a fixed seed by scripts/fixtures/tools-v1.ts. The recommended
  experiment compares three configurations that differ only in their
  toolsets, file as the baseline against file + terminal and file + terminal +
  code_execution, with memory off and no skills or documents.
tasks:
  - big_csv
  - extract_ibans
  - reshape_json
  - checksum
  - join_three
  - small_lookup
