name: hermes-evals

# Trial slot networks: internal (no route out) and with an isolated gateway
# (the host has no address on them either), so a trial can reach nothing but
# the egress service, which is attached to every slot. Engine 28+ is needed
# for the isolated gateway mode; the worker's self-test proves the isolation
# on every machine before any experiment runs.
x-trial-network: &trial-network
  driver: bridge
  internal: true
  driver_opts:
    com.docker.network.bridge.gateway_mode_ipv4: isolated
    com.docker.network.bridge.gateway_mode_ipv6: isolated
  labels:
    hermes-evals.role: trial-network

x-trial-settings: &trial-settings
  TRIAL_IMAGE: hermes-evals/trial:v0.22.4-4d04303
  TRIAL_VOLUME: hermes-evals-trials

# The LLM judge's platform default, for llm_judge checks that name no
# `model:` (unset by default; see .env.example). The worker scores with it;
# the api reads it to refuse a launch or re-score while the judge's provider
# is not ready. Judge calls go through egress's admin socket, so neither
# holds a provider key. Read from the shell, then .env; empty means unset.
x-judge-settings: &judge-settings
  JUDGE_PROVIDER: ${JUDGE_PROVIDER:-}
  JUDGE_MODEL: ${JUDGE_MODEL:-}
  JUDGE_BASE_URL: ${JUDGE_BASE_URL:-}

# Provider keys belong to egress alone. The api and the worker load .env for
# their settings and the stdio MCP values, so every key .env can hold is
# blanked here, over env_file: neither process, nor a verifier script the
# worker runs as its own child (same uid, able to read /proc/1/environ),
# ever holds one. Readiness asks egress which keys are set (/env-names).
# Keep in step with the apiKeyEnv names in PROVIDER_ROUTES
# (apps/api/src/execution/providers-map.ts).
x-no-provider-keys: &no-provider-keys
  NOUS_API_KEY: ''
  OPENROUTER_API_KEY: ''
  OPENAI_API_KEY: ''
  ANTHROPIC_API_KEY: ''
  CUSTOM_API_KEY: ''

# http MCP header values belong to egress alone (plan 5.3): blanked for the
# api and the worker the same way, so a verifier script cannot read them.
# Nothing in either process needs the value; the launch check asks egress
# which names it holds. The sample vendor-directory's token (profile samples).
x-egress-only-values: &egress-only-values
  VENDOR_DIRECTORY_TOKEN: ''

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: hermes
      POSTGRES_DB: hermes_evals
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Loopback only, for local development; trials have no route to the host.
    ports:
      - '127.0.0.1:5432:5432'
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hermes -d hermes_evals']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      <<: [*judge-settings, *no-provider-keys, *egress-only-values]
      NODE_ENV: production
      PORT: '3000'
      # All interfaces inside the container, for nginx and the published
      # port (itself bound to loopback on the host).
      HOST: 0.0.0.0
      DATABASE_URL: postgres://hermes:hermes@postgres:5432/hermes_evals
      DATA_DIR: /data
      CORS_ORIGIN: http://localhost:8080
      # The price table a launch freezes into the experiment (plan 7.2).
      PRICES_FILE: /config/prices.yaml
      # Connect Nous Portal from the UI (plan 6.1), over provider-admin.
      NOUS_LOGIN_URL: http://nous-login:8650
    # No suites mount: the worker loads suites (verifiers are user code) and
    # the API serves what it stored, from Postgres and the blobs in evaldata.
    volumes:
      - evaldata:/data
      - ./config:/config:ro
    ports:
      - '127.0.0.1:3000:3000'
    networks: [backend, provider-admin]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://localhost:3000/api/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    # stdio MCP env values come from .env; the worker records only their names
    # on its workers row. It holds no provider key (blanked below): trials and
    # the LLM judge reach models through egress.
    env_file:
      - path: .env
        required: false
    environment:
      <<: [*trial-settings, *judge-settings, *no-provider-keys, *egress-only-values]
      # The sample stdio MCP server invoice-db's file (see .env.example), read
      # from the shell, then .env, like the judge settings, so a smoke start
      # can set it without editing .env. Empty means unset.
      INVOICE_DB_URL: ${INVOICE_DB_URL:-}
      # Total tokens the model gateway serves one attempt (sent as the
      # registration's maxTokens); empty means 2000000.
      MODEL_TOKEN_CAP_PER_ATTEMPT: ${MODEL_TOKEN_CAP_PER_ATTEMPT:-}
      NODE_ENV: production
      DATABASE_URL: postgres://hermes:hermes@postgres:5432/hermes_evals
      SUITES_DIR: /data/suites
      DATA_DIR: /data
      TRIALS_DIR: /trials
      WORKER_CONCURRENCY: '3'
      DOCKER_SOCKET: /run/guard/docker.sock
      EGRESS_ADMIN_SOCKET: /run/egress/admin.sock
      # One worker per Docker daemon. A second worker on the same daemon needs
      # its own, disjoint list of slot networks (and docker-guard's
      # TRIAL_NETWORKS must hold them all).
      TRIAL_SLOTS: hermes-evals-trial-0,hermes-evals-trial-1,hermes-evals-trial-2,hermes-evals-trial-3
      # The provider guard asks nous-login whether Nous Portal is connected.
      NOUS_LOGIN_URL: http://nous-login:8650
    # Suites load here, at every start and on POST /suites/reload. Read-write
    # for the save of a draft alone (Phase 5b, plan 4.6): it writes through a
    # dot-named staging folder and a rename, under the folder's lock; the
    # loader never writes. On Linux, uid 10000 must be able to write ./suites
    # (README, "Suite authoring").
    volumes:
      - ./suites:/data/suites
      - evaldata:/data
      - trials:/trials
      - guard-sock:/run/guard
      - egress-admin:/run/egress
    networks: [backend, provider-admin]
    # A stop hands running trials back: each container is stopped (SIGTERM,
    # SIGKILL after 10 s), the lifecycle waits up to 60 s, then a last
    # recovery pass ends those attempts as worker_lost and requeues their runs.
    stop_grace_period: 90s
    # A worker that dies (an OOM, an unhandled rejection, which it exits on)
    # comes back, and its recovery pass at start ends what it left behind.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
      trial-image:
        condition: service_completed_successfully
      docker-guard:
        condition: service_started
      egress:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - '127.0.0.1:8080:80'
    networks: [backend]
    depends_on:
      api:
        condition: service_healthy

  # Builds the trial image, checks it starts, and exits.
  trial-image:
    image: hermes-evals/trial:v0.22.4-4d04303
    build:
      context: .
      dockerfile: docker/trial.Dockerfile
    network_mode: none
    restart: 'no'

  # The only process with the Docker socket. No network; serves a filtered
  # Docker API on a unix socket that only the worker mounts.
  docker-guard:
    image: hermes-evals/docker-guard
    build:
      context: .
      dockerfile: docker/node-service.Dockerfile
      args:
        APP: docker-guard
    environment:
      <<: *trial-settings
      TRIAL_NETWORKS: hermes-evals-trial-0,hermes-evals-trial-1,hermes-evals-trial-2,hermes-evals-trial-3
      LISTEN: /run/guard/docker.sock
      DOCKER_SOCK: /var/run/docker.sock
    user: '0:0'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    network_mode: none
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      - guard-sock:/run/guard
    restart: unless-stopped

  # The only network path out of a trial: forward proxy (:3128), model
  # gateway (:8080/v1) and MCP gateway (:8080/mcp/<name>). Provider
  # credentials and http MCP header values live here, never in a trial. The
  # worker's LLM judge calls come over the admin socket (/judges/<id>) and
  # are forwarded by the same gateway code.
  egress:
    image: hermes-evals/egress
    build:
      context: .
      dockerfile: docker/node-service.Dockerfile
      args:
        APP: egress
    env_file:
      - path: .env
        required: false
    environment:
      ADMIN_SOCKET: /run/egress/admin.sock
      # The cap for a registration that names no maxTokens; past it the model
      # gateway answers 429 (token_cap_reached). Empty means 2000000.
      MODEL_TOKEN_CAP_PER_ATTEMPT: ${MODEL_TOKEN_CAP_PER_ATTEMPT:-}
      # One entry per upstream in PROVIDER_ROUTES (apps/api/src/execution/providers-map.ts);
      # keep the two in step. `custom` has no entry: each custom attempt
      # registers its own base URL, and CUSTOM_API_KEY (from .env) is its key.
      MODEL_UPSTREAMS: >-
        {"nous":{"baseUrl":"http://nous-proxy:8645/v1","bodyDefaults":{"reasoning":{"enabled":true,"effort":"medium"}}},
         "nous-api":{"baseUrl":"https://inference-api.nousresearch.com/v1","apiKeyEnv":"NOUS_API_KEY","bodyDefaults":{"reasoning":{"enabled":true,"effort":"medium"}}},
         "openrouter":{"baseUrl":"https://openrouter.ai/api/v1","apiKeyEnv":"OPENROUTER_API_KEY"},
         "openai":{"baseUrl":"https://api.openai.com/v1","apiKeyEnv":"OPENAI_API_KEY"},
         "anthropic":{"baseUrl":"https://api.anthropic.com/v1","apiKeyEnv":"ANTHROPIC_API_KEY"},
         "mock":{"baseUrl":"http://mock-model:8090/v1"}}
      # The sample vendor-directory's header (profile samples). Its http
      # definition maps Authorization to VENDOR_DIRECTORY_TOKEN and egress
      # sends the variable's value unchanged, so it holds the whole value;
      # .env holds only the token, which vendor-directory checks as
      # `Bearer <token>`. Empty when unset, which egress reports as not set.
      VENDOR_DIRECTORY_TOKEN: ${VENDOR_DIRECTORY_TOKEN:+Bearer ${VENDOR_DIRECTORY_TOKEN}}
    user: node
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    volumes:
      - egress-admin:/run/egress
    networks:
      edge: {}
      llm: {}
      mcp-samples: {}
      trial-0: { aliases: [egress] }
      trial-1: { aliases: [egress] }
      trial-2: { aliases: [egress] }
      trial-3: { aliases: [egress] }
    # Agents call egress directly with their attempt tokens; its own caps
    # (8 model calls per attempt, 512 sockets) bound its memory, and this keeps
    # it from ever taking memory from Postgres on the same Docker VM.
    mem_limit: 1g
    restart: unless-stopped

  # Serves Nous model calls with the single Nous Portal login in the
  # nous-home volume; egress forwards to it. Connect the login from the UI
  # (System > Model access > Connect), which nous-login writes into the
  # volume. Without a login `hermes proxy start` exits, so the loop retries
  # every 5 s and picks up a new login without a restart.
  # For development you can instead reuse this machine's Hermes login: run
  # `hermes proxy start --provider nous` on the host and set
  # NOUS_HOST_PROXY=host.docker.internal:8645 in .env (egress then forwards to
  # it; see apps/egress/src/host-forward.ts). Fallback without the UI:
  #   docker compose run --rm --entrypoint /opt/hermes/.venv/bin/hermes nous-proxy auth add nous --type oauth --no-browser
  nous-proxy:
    image: hermes-evals/trial:v0.22.4-4d04303
    init: true
    entrypoint:
      - /bin/sh
      - -c
      - |
        trap 'kill "$$pid" 2>/dev/null; exit 0' TERM INT
        while :; do
          /opt/hermes/.venv/bin/hermes proxy start --provider nous --host 0.0.0.0 --port 8645 &
          pid=$$!
          wait "$$pid"
          sleep 5 & wait $$!
        done
    environment:
      HOME: /opt/data
      HERMES_HOME: /opt/data
    volumes:
      - nous-home:/opt/data
    networks: [edge, llm]
    depends_on:
      trial-image:
        condition: service_completed_successfully
    restart: unless-stopped

  # Connects Nous Portal from the UI (plan 6.1): runs Hermes's own device
  # login in the nous-home volume, which nous-proxy serves model calls from.
  # Only the api and the worker reach it (provider-admin); edge is its way to
  # the portal. Tokens never leave the volume.
  nous-login:
    image: hermes-evals/trial:v0.22.4-4d04303
    init: true
    entrypoint: ['/opt/hermes/.venv/bin/python', '/opt/nous-login/nous-login.py']
    environment:
      HOME: /opt/data
      HERMES_HOME: /opt/data
      NOUS_LOGIN_PORT: '8650'
    volumes:
      - nous-home:/opt/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [edge, provider-admin]
    depends_on:
      trial-image:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', '/opt/hermes/.venv/bin/python', '/opt/nous-login/nous-login.py', '--health']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Scripted OpenAI-compatible model (apps/egress/src/mock-model.ts), for the
  # sandbox smoke test and for test experiments: a configuration with provider
  # `custom` and base URL http://mock-model:8090/v1 runs against it at no cost.
  # MOCK_STEPS is the default script. MOCK_SCRIPTS, from .env, can give
  # prompts or skills that contain a phrase their own answers:
  #   MOCK_SCRIPTS=[{"match":"<phrase>","steps":[{"content":"..."}]}]
  mock-model:
    image: hermes-evals/egress
    profiles: [test]
    command: ['node', 'dist/mock-model.js']
    user: node
    read_only: true
    cap_drop: [ALL]
    environment:
      MOCK_SCRIPTS: ${MOCK_SCRIPTS:-}
      MOCK_STEPS: >-
        [{"tool":"terminal","arguments":{"command":"id; echo HOST=$(hostname); ls /; ls -a /opt/data; head -3 /workspace/invoices.csv; echo PG=$(curl -sS -m 3 http://postgres:5432 2>&1 | head -c 120); echo META=$(curl -sS -m 3 --noproxy '*' http://169.254.169.254/ 2>&1 | head -c 120); echo WEB=$(curl -sS -m 5 -o /dev/null -w '%{http_code}' https://example.com 2>&1 | head -c 120); echo SECRETS=$(env | grep -c -i -E 'nous_api|openrouter_api|anthropic_api|openai_api'); echo PROBE_DONE"}},
         {"content":"The invoices total 1042.00.\n```json\n{\"total\": 1042.00}\n```"}]
    networks: [llm]

  # The sample http MCP server (plan 18.2 P4, docker/mcp/vendor-directory):
  # read-only vendor data for mcp-v1, streamable HTTP at
  # http://vendor-directory:8000/mcp. Only egress shares its network, so a
  # trial reaches it through egress's MCP gateway, which adds
  # `Authorization: Bearer <VENDOR_DIRECTORY_TOKEN>`. Built FROM the trial
  # image (it runs on the MCP SDK in Hermes's venv). Without the token it
  # exits at start, so it stops after three tries with the reason in its log.
  #   docker compose --profile samples up -d
  vendor-directory:
    image: hermes-evals/vendor-directory
    profiles: [samples]
    build:
      context: docker/mcp/vendor-directory
      additional_contexts:
        trial: service:trial-image
      args:
        TRIAL_IMAGE: trial
    environment:
      VENDOR_DIRECTORY_TOKEN: ${VENDOR_DIRECTORY_TOKEN:-}
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [mcp-samples]
    depends_on:
      trial-image:
        condition: service_completed_successfully
    healthcheck:
      test:
        ['CMD', '/opt/hermes/.venv/bin/python', '/opt/mcp/vendor-directory/server.py', '--health']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure:3

volumes:
  pgdata:
  evaldata:
  trials:
    name: hermes-evals-trials
  guard-sock:
  egress-admin:
  nous-home:

networks:
  backend: {}
  # egress, nous-proxy and nous-login only: the way to the internet.
  edge: {}
  # egress to nous-proxy and the mock model; no route out.
  llm:
    internal: true
  # api and worker to nous-login only; no route out.
  provider-admin:
    internal: true
  # egress to the sample http MCP servers (profile samples); no route out,
  # and no trial is attached.
  mcp-samples:
    internal: true
  trial-0:
    <<: *trial-network
    name: hermes-evals-trial-0
  trial-1:
    <<: *trial-network
    name: hermes-evals-trial-1
  trial-2:
    <<: *trial-network
    name: hermes-evals-trial-2
  trial-3:
    <<: *trial-network
    name: hermes-evals-trial-3
