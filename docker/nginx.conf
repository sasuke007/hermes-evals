# Requests for any other name are dropped: a page on another site whose name
# re-resolves to this machine (DNS rebinding) never reaches the API. The API
# checks Host itself too (apps/api/src/common/host-allowlist.ts).
server {
  listen 80 default_server;
  return 444;
}

server {
  listen 80;
  server_name localhost 127.0.0.1;
  root /usr/share/nginx/html;
  index index.html;

  # `api` is looked up per request through Docker's embedded DNS, not once at
  # start, so the api container can be recreated alone (it may come back on
  # another address) without restarting web. A name proxy_pass holds as a
  # variable is resolved only through `resolver`; the answer is kept 10 s.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  location /api/ {
    # No URI part, as a variable too: nginx forwards the client's request
    # URI as sent, so a path parameter keeps its %2F (skill files and
    # fixtures in subfolders, e.g.
    # /api/resources/skills/<id>/files/examples%2Freconcile.py). With one,
    # nginx would decode it into a path no route matches. The API serves
    # everything under /api already.
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;          # keep SSE streaming
    proxy_read_timeout 3600s;
    # Uploads: skills up to 20 MB, documents up to 50 MB (the API answers 413
    # above its own caps); nginx's default would refuse anything over 1 MB.
    client_max_body_size 64m;
  }

  # Build files carry their content hash in their name: cache them for good. A
  # name that is not there is a 404, never index.html, so a page from an older
  # build that asks for a file this build does not have fails plainly (the app
  # then loads the address again: apps/web/src/router/staleBuild.ts).
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # index.html names the build's files, so a browser must not reuse an old one
  # after a redeploy without asking (no-cache: revalidate every time).
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
