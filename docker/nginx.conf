# Requests for any other name are dropped: a page on another site whose name
# re-resolves to this machine (DNS rebinding) never reaches the API. The API
# checks Host itself too (apps/api/src/common/host-allowlist.ts).
server {
  listen 80 default_server;
  return 444;
}

server {
  listen 80;
  server_name localhost 127.0.0.1;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    # No URI part: nginx forwards the client's request URI as sent, so a
    # path parameter keeps its %2F (skill files and fixtures in subfolders,
    # e.g. /api/resources/skills/<id>/files/examples%2Freconcile.py). With
    # one, nginx would decode it into a path no route matches. The API
    # serves everything under /api already.
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;          # keep SSE streaming
    proxy_read_timeout 3600s;
    # Uploads: skills up to 20 MB, documents up to 50 MB (the API answers 413
    # above its own caps); nginx's default would refuse anything over 1 MB.
    client_max_body_size 64m;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
